# Test fixture config: pinned values the test assertions depend on. Do not tune.

[booking]
default_radius_km = 5.0
default_matching_strategy = "nearest"   # nearest | highest_rated

# Requested type -> type substituted at the requested type's price when none is free.
[booking.upgrades]
hatchback = "sedan"

# Slab pricing: each km is charged at the rate of the slab it falls in.
# `up_to_km` is a cumulative bound; the last tier has none (open-ended).
[pricing.hatchback]
min_fare = 50
tiers = [
    { up_to_km = 2, rate_per_km = 10 },
    { up_to_km = 5, rate_per_km = 8 },
    { rate_per_km = 5 },
]

[pricing.sedan]
min_fare = 60
tiers = [
    { up_to_km = 2, rate_per_km = 12 },
    { up_to_km = 5, rate_per_km = 10 },
    { rate_per_km = 7 },
]

[drivers]
offline_after_minutes = 60

[cancellation]
policy = "grace_period"     # grace_period | free
grace_period_minutes = 2   # free to cancel within this window after booking
fee = 25

# Multiplier = demand / supply near the pickup, within [1, cap]; locked onto the ride at booking.
[surge]
enabled = false
area_radius_km = 2.0       # demand and supply are counted within this distance of the pickup
window_minutes = 15        # bookings this recent count as demand
cap = 2.0

[database]
url = "postgresql://rides:rides@localhost:5433/rides"
pool_size = 2
