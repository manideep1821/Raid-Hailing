services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rides
      POSTGRES_PASSWORD: rides
      POSTGRES_DB: rides
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rides -d rides"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
